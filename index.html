<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>个人简历（需要密码访问）</title>
  <meta name="description" content="受保护的在线简历：请输入访问密码后查看完整内容。">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0f1417">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f1417'/%3E%3Ccircle cx='32' cy='24' r='10' fill='%23ffffff'/%3E%3Cpath d='M14 54c0-10 8-16 18-16s18 6 18 16z' fill='%23ffffff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* 仅密码门使用，解锁后页面回到简历本身的样式 */
    body.gate {
      min-height: 100vh;
      background: #0f1417;
      color: #e8edeb;
    }

    body.gate::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.04) 0 1px, transparent 1px 72px),
        repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.04) 0 1px, transparent 1px 72px);
    }

    .gate-box {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }

    .gate-card {
      width: 100%;
      max-width: 420px;
      padding: 36px 32px 30px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      text-align: left;
    }

    .gate-lock {
      display: inline-grid;
      place-items: center;
      width: 44px;
      height: 44px;
      margin-bottom: 18px;
      border-radius: 10px;
      background: #e3f1ee;
      color: #0a5c50;
    }

    .gate-lock svg {
      width: 22px;
      height: 22px;
    }

    .gate-title {
      font-size: 24px;
      color: #101519;
    }

    .gate-sub {
      margin-top: 8px;
      color: #5d6b73;
      font-size: 14.5px;
      line-height: 1.7;
    }

    .gate-form {
      margin-top: 22px;
    }

    .gate-label {
      display: block;
      margin-bottom: 6px;
      color: #263138;
      font-size: 13px;
      font-weight: 600;
    }

    .gate-row {
      display: flex;
      gap: 10px;
    }

    .gate-row input {
      flex: 1;
      min-width: 0;
      padding: 11px 12px;
      font-family: inherit;
      font-size: 15px;
      color: #101519;
      background: #fff;
      border: 1px solid #cdd4d0;
      border-radius: 8px;
    }

    .gate-row input:focus-visible {
      outline: 2px solid #0e7c6b;
      outline-offset: 1px;
      border-color: #0e7c6b;
    }

    .gate-btn {
      flex: none;
      padding: 11px 20px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      background: #0e7c6b;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }

    .gate-btn:hover {
      background: #12907c;
    }

    .gate-btn[disabled] {
      opacity: 0.65;
      cursor: default;
    }

    .gate-tip {
      margin-top: 12px;
      color: #c0392b;
      font-size: 14px;
    }

    .gate-note {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid #e1e5e2;
      color: #89959b;
      font-size: 12.5px;
      line-height: 1.7;
    }

    @media (max-width: 520px) {
      .gate-row {
        flex-direction: column;
      }

      .gate-btn {
        width: 100%;
      }
    }

    /* 解锁后简历内容淡入 */
    #resumeContent {
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    #resumeContent.is-ready {
      opacity: 1;
    }

    @media (prefers-reduced-motion: reduce) {
      #resumeContent {
        transition: none;
      }
    }
  </style>
</head>
<body class="gate">
  <div class="gate-box" id="passwordBox">
    <div class="gate-card">
      <span class="gate-lock" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect width="18" height="11" x="3" y="11" rx="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </span>
      <h1 class="gate-title">个人简历</h1>
      <p class="gate-sub">简历内容已加密存储，请输入访问密码后查看完整内容。</p>
      <form class="gate-form" id="gateForm" autocomplete="off" novalidate>
        <label class="gate-label" for="pwdInput">访问密码</label>
        <div class="gate-row">
          <input type="password" id="pwdInput" name="pwd" placeholder="请输入密码" autocomplete="current-password" required>
          <button type="submit" class="gate-btn" id="gateBtn">确认</button>
        </div>
      </form>
      <p class="gate-tip" id="tip" hidden>密码错误，请重试</p>
      <p class="gate-tip" id="tipEnv" hidden>当前浏览器环境不支持解密，请通过 https 或本地服务器打开本页。</p>
      <p class="gate-note">密码由本人单独提供。未解锁时，本页不包含任何简历内容。</p>
    </div>
  </div>

  <div id="resumeContent" hidden></div>

  <script src="resume.enc.js"></script>
  <script src="gate.js"></script>
</body>
</html>
